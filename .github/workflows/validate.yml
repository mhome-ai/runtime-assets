name: Validate asset manifests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  model-packs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: scripts/verify-model-packs.sh
      - run: bash -n scripts/prepare-model-pack.sh scripts/verify-model-packs.sh
      - run: python -m py_compile scripts/smoke-kokoro-onnx.py

  ollama-runtimes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y zstd
      - run: scripts/ollama/verify-runtimes.sh
      - run: bash -n scripts/ollama/pack-runtimes.sh scripts/ollama/verify-runtimes.sh scripts/ollama/pack-runtimes.test.sh
      - run: python3 -m py_compile scripts/ollama/pack_runtimes.py
      - run: scripts/ollama/pack-runtimes.test.sh
